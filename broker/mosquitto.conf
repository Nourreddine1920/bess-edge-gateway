# Mosquitto broker: TLS only, client certificate REQUIRED (mutual TLS).
# The certificate CN becomes the MQTT username, so a device's identity comes
# from its private key, not from a shared password.
per_listener_settings false
allow_anonymous false

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

acl_file /mosquitto/config/acl

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
